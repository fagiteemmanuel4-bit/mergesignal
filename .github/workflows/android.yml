name: Build Prompt Notes and deploy live app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-web:
    name: Publish live web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload live app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy live app
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    name: Build and publish Android APK
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 8

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-notes-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prompt-notes-v1.1.${{ github.run_number }}
          name: Prompt Notes Android v1.1.${{ github.run_number }}
          body: |
            Prompt Notes Android APK.
            Minimum Android version: Android 7.0 (API 24).
            Live UI is served from GitHub Pages and updates without reinstalling.
            This is a debug-signed APK for direct installation.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
