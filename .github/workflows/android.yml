name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run prep
      - run: npx cap add android
      - name: Install native Android microphone and haptics bridge
        run: npm run android:patch
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PromptNotes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-notes-debug-apk
          path: PromptNotes.apk
      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Prompt Notes build ${{ github.run_number }}
          body: Debug APK. Download PromptNotes.apk below and install it on an Android phone (allow installs from this source).
          files: PromptNotes.apk
          make_latest: true
